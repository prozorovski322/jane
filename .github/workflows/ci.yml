name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Content bundle is up to date
        run: |
          npm run content:build
          git diff --exit-code -- src/core/content/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run content:check -- --strict
      - run: npm test -- --ci

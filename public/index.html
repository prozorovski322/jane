<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Jane — английский с нуля до C1</title>
    <meta
      name="description"
      content="Бесплатный курс английского для русскоговорящих: от нуля до C1. Слова, грамматика, аудирование, чтение, говорение и письмо. Без регистрации и рекламы, прогресс хранится в вашем браузере."
    />
    <meta name="theme-color" content="#14110E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #14110e;
      }
      @media (prefers-color-scheme: light) {
        body {
          background-color: #fbf8f3;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Чтобы заниматься, включите JavaScript в браузере.</noscript>
    <div id="root"></div>
    <script>
      // Offline support (sw.js is generated by `npm run web:build`). Only the exported site has
      // its scripts under /_expo/static: the dev server must not be cached.
      addEventListener('load', function () {
        if (
          'serviceWorker' in navigator &&
          document.querySelector('script[src*="/_expo/static/js/web/"]')
        ) {
          // Offline the update check fails; the stored version keeps working.
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Jane — английский с нуля до C1</title>
    <meta
      name="description"
      content="Бесплатный курс английского для русскоговорящих: от нуля до C1. Слова, грамматика, аудирование, чтение, говорение и письмо. Без подписок и рекламы."
    />
    <link rel="canonical" href="https://jane-english.netlify.app/" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (Telegram, VK, WhatsApp, social networks). Absolute URLs are required. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jane" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://jane-english.netlify.app/" />
    <meta property="og:title" content="Jane — английский с нуля до C1" />
    <meta
      property="og:description"
      content="Бесплатный курс английского для русскоговорящих: слова, грамматика, аудирование, чтение, говорение и письмо. Без подписок и рекламы."
    />
    <meta property="og:image" content="https://jane-english.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jane — английский с нуля до C1" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #000000;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .loading {
        margin: auto;
        padding: 14px 16px;
        color: #b69cff;
        font: 600 17px/1.5 system-ui, sans-serif;
      }
      .loading::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 10px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        to {
          opacity: 0.2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading::before {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <noscript><p class="loading">Чтобы открыть курс, включите JavaScript.</p></noscript>
      <p class="loading" aria-live="polite">Загружаем курс…</p>
    </div>
    <script src="/register-sw.js" defer></script>
  </body>
</html>
